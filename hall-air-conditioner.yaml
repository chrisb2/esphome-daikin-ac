esphome:
  name: hall-air-conditioner
  friendly_name: Hall Air Conditioner

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

remote_transmitter:
  id: daikin_hall_ac
  pin: GPIO10
  carrier_duty_percent: 50%
  non_blocking: true

sensor:
  - platform: homeassistant
    id: esp_home_bedroom_temp
    entity_id: sensor.esphome_web_035670_main_bedroom_temperature
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    internal: false

interval:
  - interval: 15s
    then: 
      - lambda: |
            ESP_LOGI("bedroom temp", "%f", id(esp_home_bedroom_temp).state);

climate:
  - platform: heatpumpir
    id: "hall_ac"
    name: "Hall AC"
    protocol: daikin
    transmitter_id: daikin_hall_ac
    max_temperature: 30
    min_temperature: 10
    vertical_default: down
    horizontal_default: middle
    visual:
      temperature_step: 0.1
    sensor: esp_home_bedroom_temp

  - platform: thermostat
    id: main_bedroom_thermostat
    name: "Main Bedroom Thermostat"
    sensor: esp_home_bedroom_temp

    min_idle_time: 300s
    min_heating_off_time: 300s
    min_heating_run_time: 300s

    heat_deadband: 0.4
    heat_overrun: 0.1

    default_preset: bedtime
    on_boot_restore_from: default_preset
    preset:
      - name: bedtime
        default_target_temperature_low: 18.5

    visual: 
      temperature_step: 0.1

    heat_action:
      climate.control:
        id: hall_ac
        mode: HEAT
  
    idle_action:
        - climate.control:
            id: hall_ac
            mode: "OFF"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  
ota:
  - platform: esphome
    password: "d73b2cbaca94c98ddeff13882e11a451"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Hall-Air-Conditioner"
    password: "CB5RNEbZnIBf"

